# Netlify builds the site from this repo on every push to the production branch.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The Games section was renamed Tools; keep old links working.
[[redirects]]
  from = "/games/*"
  to = "/tools/:splat"
  status = 301

[[redirects]]
  from = "/games"
  to = "/tools"
  status = 301

# Single-page app: let React Router handle every path (/tools/blackjack etc.).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
