# Refreshes the NFL Survivor Grid data (public/data/survivor.json) from nflverse.
# If the numbers changed, commits the new file to main, and Netlify redeploys.
name: Update survivor data

on:
  schedule:
    # Once a day at 13:17 UTC (9:17am ET in season; 8:17am after clocks change).
    # Off the top of the hour because GitHub delays jobs scheduled at :00.
    - cron: "17 13 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-survivor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild survivor data
        run: npx tsx scripts/update-survivor.ts

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/survivor.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "survivor-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/survivor.json
          git commit -m "Update survivor data ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
